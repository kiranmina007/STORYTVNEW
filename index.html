    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: linear-gradient(rgba(9, 6, 19, 0.75), rgba(9, 6, 19, 0.9)), url('img/bg.png') no-repeat center center / cover;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glowing Background Elements */
        .glow {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, rgba(0,0,0,0) 70%);
            filter: blur(50px);
            z-index: 1;
            pointer-events: none;
            animation: floatGlow 15s ease-in-out infinite alternate;
        }
        
        .glow-1 { top: -150px; right: -150px; }
        .glow-2 { bottom: -150px; left: -150px; background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(0,0,0,0) 70%); }
        
        @keyframes floatGlow {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-30px, 50px); }
        }

        .card {
            background: rgba(25, 19, 48, 0.45);
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 55px 40px;
            width: 90%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            z-index: 2;
            position: relative;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logo-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 35px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            animation: pulseGlow 3s ease-in-out infinite;
        }

        .logo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            background: #090613;
            border: 4px solid #090613;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 25px rgba(16, 185, 129, 0.25); }
            50% { box-shadow: 0 0 45px rgba(59, 130, 246, 0.15); }
        }

        h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 15px;
            background: linear-gradient(to right, #ffffff, #b0a9cd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 16px;
            color: #8c85a8;
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 18px 30px;
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: all 0.6s ease;
        }

        .btn:hover::after {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(16, 185, 129, 0.25);
        }

        .btn:active {
            transform: translateY(0);
        }

        .copy {
            margin-top: 35px;
            font-size: 13px;
            color: #5c5577;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
